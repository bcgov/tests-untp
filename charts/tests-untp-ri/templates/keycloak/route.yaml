{{- if and .Values.route.enabled .Values.route.keycloak.enabled .Values.route.keycloak.host }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "tests-untp-ri.keycloak.fullname" . }}
  labels:
    {{- include "tests-untp-ri.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.route.keycloak.host | quote }}
  to:
    kind: Service
    name: {{ include "tests-untp-ri.keycloak.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
