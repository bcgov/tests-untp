## Development overlay — f890b1-dev (shared with untp-publisher-service).
##   helm upgrade --install tests-untp-ri ./charts/tests-untp-ri -f deploy/dev/values.yaml -n f890b1-dev
##
## Namespace quota headroom (before RI install):
##   requests.storage (netapp-file-standard): 512Mi used / 1Gi hard → 512Mi left
##   requests.memory (long-running):          512Mi used / 2Gi hard → ~1.5Gi left
##   requests.cpu (long-running):             100m used / 500m hard → 400m left
##
## This overlay uses 512Mi PVC (ri-db + vckit-db only) and emptyDir for storage/minio.
## Sum of memory *requests* for RI pods ≈ 800Mi (fits with publisher).

route:
  annotations:
    route.openshift.io/termination: edge
  ri:
    host: tests-untp-ri-dev.apps.gold.devops.gov.bc.ca
  keycloak:
    host: tests-untp-ri-keycloak-dev.apps.gold.devops.gov.bc.ca

ri:
  image:
    repository: ghcr.io/uncefact/tests-untp/reference-implementation
    tag: next
    pullPolicy: Always
  verifyAllowPrivateUrls: true
  deploymentEnvironment: dev
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 96Mi

keycloak:
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: 15m
      memory: 192Mi

riDb:
  persistence:
    enabled: true
    size: 256Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 96Mi

vckitDb:
  persistence:
    enabled: true
    size: 256Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 96Mi

vckit:
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 96Mi

storage:
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

idr:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

minio:
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
