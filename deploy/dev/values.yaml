## f890b1-dev — shared with untp-publisher-service (see deploy/f890b1-dev-quota.md).
##   helm upgrade --install tests-untp-ri ./charts/tests-untp-ri -f deploy/dev/values.yaml -n f890b1-dev
##
## Shared storage budget: publisher 512Mi PVC + RI 256Mi + 256Mi DB PVCs = 1Gi.
## Shared memory requests: publisher ~256Mi + RI ~768Mi < 2Gi.

route:
  annotations:
    route.openshift.io/termination: edge
  ri:
    host: tests-untp-ri-dev.apps.gold.devops.gov.bc.ca
  keycloak:
    host: tests-untp-ri-keycloak-dev.apps.gold.devops.gov.bc.ca

ri:
  image:
    repository: ghcr.io/uncefact/tests-untp/reference-implementation
    tag: next
    pullPolicy: Always
  verifyAllowPrivateUrls: true
  deploymentEnvironment: dev
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 96Mi

keycloak:
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: 15m
      memory: 192Mi

riDb:
  persistence:
    enabled: true
    size: 256Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 96Mi

vckitDb:
  persistence:
    enabled: true
    size: 256Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 96Mi

vckit:
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 10m
      memory: 96Mi

storage:
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

idr:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

minio:
  persistence:
    enabled: false
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
