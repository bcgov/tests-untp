## Development overlay (BC Gov OpenShift Gold) — minimal quota (with untp-publisher in f890b1-dev).
##   helm upgrade --install tests-untp-ri ./charts/tests-untp-ri -f deploy/dev/values.yaml -n f890b1-dev
##
## Storage: 5 x 128Mi PVC ≈ 640Mi for this release (plus publisher PVCs in the same namespace).
## Memory: low limits; raise keycloak/ri if pods OOM.

route:
  annotations:
    route.openshift.io/termination: edge
  ri:
    host: tests-untp-ri-dev.apps.gold.devops.gov.bc.ca
  keycloak:
    host: tests-untp-ri-keycloak-dev.apps.gold.devops.gov.bc.ca

ri:
  image:
    repository: ghcr.io/uncefact/tests-untp/reference-implementation
    tag: next
    pullPolicy: Always
  verifyAllowPrivateUrls: true
  deploymentEnvironment: dev
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 25m
      memory: 128Mi

keycloak:
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: 25m
      memory: 256Mi

riDb:
  persistence:
    size: 128Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi

vckitDb:
  persistence:
    size: 128Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi

vckit:
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 25m
      memory: 128Mi

storage:
  persistence:
    size: 128Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi

idr:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi

minio:
  persistence:
    size: 128Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi
