## Development overlay (BC Gov OpenShift Gold) — low quota profile.
## Namespace: f890b1-dev (same as untp-publisher-service).
##   helm upgrade --install tests-untp-ri ./charts/tests-untp-ri -f deploy/dev/values.yaml -n f890b1-dev
##
## ~2.5Gi PVC total (5 x 512Mi). Tune up if Keycloak or RI OOM.

route:
  annotations:
    route.openshift.io/termination: edge
  ri:
    host: tests-untp-ri-dev.apps.gold.devops.gov.bc.ca
  keycloak:
    host: tests-untp-ri-keycloak-dev.apps.gold.devops.gov.bc.ca

ri:
  image:
    repository: ghcr.io/uncefact/tests-untp/reference-implementation
    tag: next
    pullPolicy: Always
  verifyAllowPrivateUrls: true
  deploymentEnvironment: dev
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

keycloak:
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 384Mi

riDb:
  persistence:
    size: 512Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 192Mi

vckitDb:
  persistence:
    size: 512Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 192Mi

vckit:
  resources:
    limits:
      cpu: 400m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi

storage:
  persistence:
    size: 512Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 192Mi

idr:
  resources:
    limits:
      cpu: 300m
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 192Mi

minio:
  persistence:
    size: 512Mi
    storageClass: netapp-file-standard
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 50m
      memory: 192Mi
